name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The steps below are bash. Without this, `run:` defaults to PowerShell on
    # windows-latest, which cannot parse `set -o pipefail` and fails before
    # cargo is ever invoked. Git Bash ships on the Windows runner image.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The suite performs real searches, so give it room on slower runners.
      # The failure summary is written from inside this step rather than a
      # separate `if: failure()` step, so it cannot itself go missing. Run logs
      # need admin rights to download, which makes the step summary the only
      # way to diagnose a red build from outside the repository.
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log || {
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "### Test failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Tests passed" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^test result' test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  clippy:
    name: Clippy and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The crypto is cross-checked against an independent Python implementation
  # that re-derives the binary's own results. This is the check that would have
  # caught the little-endian account-index bug.
  crosscheck:
    name: Independent cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: cargo build --release --locked
      - name: Cross-check against the Python oracle
        run: python3 research/cross_check.py
