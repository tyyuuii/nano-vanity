name: Release

# Binaries are cut automatically from a version tag:
#     git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64 (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Collect
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/nano-vanity dist/nano-vanity-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/nano-vanity.exe dist/nano-vanity-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/

  android:
    name: Android aarch64 (Termux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # The Android target has no system linker of its own; the NDK supplies
      # the sysroot and the cross-linker. Everything in the dependency tree is
      # pure Rust, so the NDK is only ever needed to link.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      # cargo-ndk's auto-detection proved fragile here, so the linker and
      # archiver are wired up explicitly from the NDK's bundled LLVM instead.
      # `${api}` in the clang name selects the minimum supported API level.
      - name: Build
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          LINKER="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
          {
            echo "### NDK"
            echo '```'
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            echo "linker: $LINKER"
            test -x "$LINKER" && echo "linker: present" || echo "linker: MISSING"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test -x "$LINKER"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$LINKER"
          export CC_aarch64_linux_android="$LINKER"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          cargo build --release --locked --target aarch64-linux-android 2>&1 | tee build.log
      - name: Diagnostics
        if: failure()
        run: |
          {
            echo "### Build log (tail)"
            echo '```'
            tail -40 build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect
        run: |
          mkdir -p flat
          cp target/aarch64-linux-android/release/nano-vanity flat/nano-vanity-android-arm64
          chmod +x flat/nano-vanity-android-arm64
          file flat/nano-vanity-android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: flat/

  release:
    name: Publish release
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      # Full history: `gh release create` shells out to git to resolve the tag,
      # and the default shallow checkout leaves it unable to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble and checksum
        run: |
          set -euxo pipefail
          mkdir dist
          find artifacts -type f -name 'nano-vanity-*' -exec cp {} dist/ \;
          cd dist
          ls -l
          sha256sum nano-vanity-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euxo pipefail
          {
            echo "### Release"
            echo '```'
            echo "tag: $TAG"
            echo "repo: $GH_REPO"
            ls -l dist || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          # Notes are written out rather than using --generate-notes, which
          # needs commit history and adds nothing here.
          gh release create "$TAG" dist/* \
            --title "nano-vanity $TAG" \
            --notes "Prebuilt binaries. See INSTALL.md for install guides and SHA256SUMS for verification."
      - name: Diagnostics
        if: failure()
        run: echo "Release step failed; see the run log for the gh error." >> "$GITHUB_STEP_SUMMARY"
