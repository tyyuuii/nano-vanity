[workspace]
members = ["nano-keys", "nano-vanity"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
# Build-time note: codegen-units=16 with thin LTO measures as the best of both
# worlds on aarch64 -- 9s incremental release builds instead of 32s, and no
# throughput loss (57.6k vs 55.4k addr/s, i.e. slightly faster). codegen-units=1
# and lto=false were both measurably worse for one axis or the other.
