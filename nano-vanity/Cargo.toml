[package]
name = "nano-vanity"
version = "0.1.1"
edition = "2021"
description = "Multi-threaded CPU vanity address grinder for Nano (XNO)"
license = "MIT"

[[bin]]
name = "nano-vanity"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
nano-keys = { path = "../nano-keys" }

# Phase 0 spike only, and only on the gpu-test branch. Not a dependency of the
# main binary yet: the release build must stay GPU-free until Phase 2 proves a
# Vulkan kernel can be bit-identical to curve25519-dalek.
[dev-dependencies]
ash = "0.38"
