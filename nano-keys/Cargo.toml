[package]
name = "nano-keys"
version = "0.1.1"
edition = "2021"
description = "Nano (XNO) key derivation: seed -> private key -> public key -> address"
license = "MIT"

[dependencies]
blake2 = "0.10"
curve25519-dalek = { version = "4", features = ["precomputed-tables"] }
tiny-keccak = { version = "2.0.2", features = ["k12"] }

[dev-dependencies]
hex = "0.4"
# The 5.x major is linked alongside 4.x (under a rename) purely so that
# `examples/dalek_ab.rs` can A/B them on the device. It measured 1.000x with
# bit-identical output, so GPU-free CPU work has no reason to depend on it;
# it is dev-only and never reaches the shipped binary. See ERRATA.md §10.
dalek5 = { package = "curve25519-dalek", version = "5", features = ["precomputed-tables"] }
